name: Nightly Integration Tests (ziti main)

# Runs ZET integration tests against ziti main
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  call-cmake-build:
    name: Call CMake Build
    uses: ./.github/workflows/cmake.yml

  # Nightly carries the slow suites (slowtests build tag) and the legacy-auth topology.
  integration-tests:
    name: Integration Tests (${{ matrix.topology.label }})
    needs: [ call-cmake-build ]
    strategy:
      fail-fast: false
      matrix:
        topology:
          - { label: main, cluster-size: "", auth: OIDC }
          - { label: main-ha, cluster-size: "3", auth: OIDC }
          - { label: main-legacy-auth, cluster-size: "", auth: Legacy }
    uses: ./.github/workflows/integration-tests.yml
    with:
      ziti-ref: main
      label: ${{ matrix.topology.label }}
      cluster-size: ${{ matrix.topology.cluster-size }}
      auth: ${{ matrix.topology.auth }}
      slow-tests: true
    secrets: inherit

  alert-mattermost:
    name: Alert Mattermost on Failure
    needs: [ call-cmake-build, integration-tests ]
    if: failure()
    runs-on: ubuntu-latest
    env:
      ZHOOK_URL: ${{ secrets.ZHOOK_URL_DEV_NOTIFICATIONS }}
    steps:
      - uses: openziti/ziti-mattermost-action-py@main
        if: env.ZHOOK_URL
        with:
          zitiId: ${{ secrets.ZITI_MATTERMOST_IDENTITY }}
          webhookUrl: ${{ secrets.ZHOOK_URL_DEV_NOTIFICATIONS }}
          githubToken: ${{ github.token }}
          eventJson: |
            {
              "repository": {
                "full_name": "${{ github.repository }}",
                "html_url": "${{ github.server_url }}/${{ github.repository }}"
              },
              "sender": {
                "login": "github-actions",
                "html_url": "${{ github.server_url }}/${{ github.repository }}/actions",
                "avatar_url": "https://github.com/github.png"
              }
            }
          senderUsername: "GitHubZ"
